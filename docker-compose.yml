version: "3"
services:
  api-gateway:
    container_name: api-gateway
    ports:
      - "${PORT}:${PORT}"
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    user: "1000:1000"
    command: ["yarn", "start:gateway:dev"]
    volumes:
      - .:/usr/src/app:z
      - /usr/src/app/node_modules
    networks:
      - backend

  auth-service-db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DATABASE_USER} -d ${AUTH_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    ports:
      - "${AUTH_DATABASE_PORT}:${AUTH_DATABASE_PORT}"
    environment:
      POSTGRES_USER: ${AUTH_DATABASE_USER}
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD}
      POSTGRES_DB: ${AUTH_DATABASE_NAME}
    volumes: 
      - auth_db_data:/var/lib/postgresql 
    networks:
      - backend

  auth-service:
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    user: "1000:1000"
    command: ["sh", "-c", "npm run migration:auth:run && yarn start:auth:dev"]
    depends_on:
      auth-service-db:
        condition: service_healthy 
    volumes:
      - .:/usr/src/app:z
      - /usr/src/app/node_modules
    networks:
      - backend

  notification-service-db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DATABASE_USER} -d ${NOTIFICATION_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    ports:
      - "${NOTIFICATION_DATABASE_PORT}:${NOTIFICATION_DATABASE_PORT}"
    environment:
      POSTGRES_USER: ${NOTIFICATION_DATABASE_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DATABASE_NAME}
    volumes: 
      - notification_db_data:/var/lib/postgresql 
    networks:
      - backend

  notification-service:
    container_name: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - .env
    user: "1000:1000"
    command: ["sh", "-c", "npm run migration:notification:run && yarn start:notification:dev"]
    depends_on:
      notification-service-db:
        condition: service_healthy 
    volumes:
      - .:/usr/src/app:z
      - /usr/src/app/node_modules
    networks:
      - backend
  
  nmmt-redis:
    image: redis/redis-stack-server:latest
    container_name: nmmt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD}" 
    volumes:
      - redis_data:/data
    networks:
      - backend

  nmmt-redisinsight:
    image: redis/redisinsight:latest
    container_name: nmmt-redisinsight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT}:${REDIS_INSIGHT_PORT}"
    depends_on:
      - nmmt-redis
    networks:
      - backend

  nmmt-grafana:
    image: grafana/grafana-enterprise
    container_name: nmmt-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    networks:
      - backend
  
  nmmt-prometheus:
    image: prom/prometheus
    container_name: nmmt-prometheus
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  auth_db_data:
  notification_db_data:
  redis_data:
  prometheus-data:
