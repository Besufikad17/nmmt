scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3001"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:3002"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:3003"]
